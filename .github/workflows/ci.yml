name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Stale-wording guard: fails if an old name or outgrown claim
      # (scripts/stale-terms.json) reaches user-visible text again.
      - run: npm run verify:copy
      # LayoutProps/PageProps are ambient types Next.js generates into
      # .next/types/ from a dev/build run -- a fresh checkout never has
      # them otherwise, so tsc fails on app/layout.tsx without this.
      - run: npx next typegen
      - run: npx tsc --noEmit

  verify-geometry:
    # Pure math/logic checks -- shape construction (every polyhedron
    # family), attach/twist placement, D10<->D12 rewrite matching, and
    # the assembly graph's subtree/cycle logic -- all run outside the
    # browser via tsx.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:deltahedra
      - run: npm run validate:platonic
      - run: npm run validate:archimedean
      - run: npm run validate:johnson
      - run: npm run verify:attach
      - run: npm run verify:twist
      - run: npm run verify:rewrite
      - run: npm run verify:graph
      - run: npm run verify:face-connectors
      - run: npm run verify:face-attach
      - run: npm run verify:aperiodic-sets
      - run: npm run verify:stellations
      - run: npm run verify:zome-parallelohedra
      - run: npm run verify:bain-parallelohedra
      - run: npm run verify:face-registration
      - run: npm run verify:regular-nine
      - run: npm run verify:4d-polytopes
      - run: npm run verify:golden-helper
      - run: npm run verify:face-twist
      - run: npm run verify:families
      - run: npm run verify:search
      # Every other geometry/logic check (leftovers audit 2026-09-30: all
      # passed but CI never ran them), one step so the list stays readable.
      - name: Remaining geometry and logic checks
        run: |
          set -e
          for s in validate:catalan validate:prisms validate:graded-pyramids validate:rd-relatives verify:space-filling-pairs validate:star validate:star-triangulation verify:misc-face-eligibility verify:rvcmg-solids verify:rvcmg-v2-solids verify:quad-prisms verify:icosahedron-hex-alignment verify:i18n verify:4d-closure verify:duoprism verify:radial-projection verify:rcp-build verify:composite-seed-lattice verify:composite-seed-positional-residual verify:composite-seed-angular verify:composite-seed-reflection-group verify:rvcmg-hemi-rd verify:rvcmg-types verify:rvcmg-coalesce verify:rvcmg-separate verify:rvcmg-state-graph verify:rvcmg-morph verify:rvcmg-verify verify:rvcmg-split-vertex verify:rvcmg-heptagon-split verify:rvcmg-octagon-split verify:rvcmg-triangle-to-rd-h verify:rvcmg-square-to-rd-h verify:rvcmg-pentagon-to-rd-h verify:rvcmg-golden-rhombus-to-rd-h verify:rvcmg-kite-to-rd-h verify:rvcmg-regular-hex-to-rd-h verify:rvcmg-triangle-to-uhex verify:rvcmg-square-to-uhex verify:rvcmg-pentagon-to-uhex verify:rvcmg-rhombus-to-uhex verify:rvcmg-kite-to-uhex verify:rvcmg-regular-hex-to-uhex test:rvcmg; do
            echo "== $s"; npm run -s "$s"
          done

  e2e:
    # Real-browser check (Playwright) -- the actual app, driven the same
    # way a real user would: vertex select, attach, twist,
    # confirm/cancel, D10<->D12 rewrite, cascade delete, save/reload.
    # playwright.config.ts's webServer starts `npm run dev` itself.
    # Split into 3 shards (by test file) run side by side: the whole suite
    # (~84 tests, one worker against the dev server) takes over 20 min in
    # one job, and a single 15-min job was being cut off near test 51.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
